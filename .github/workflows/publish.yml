name: Publish scheduled Instagram posts

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC); posts carry their own time zone
  workflow_dispatch:
    inputs:
      mode:
        description: "check: test the connection · dry-run: show what would post · publish: post anything due now"
        type: choice
        options: [check, dry-run, publish]
        default: check

permissions:
  contents: write   # to commit posted.json

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the publisher
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
        run: |
          case "$MODE" in
            check)   python publish.py --check ;;
            dry-run) DRY_RUN=1 python publish.py ;;
            *)       python publish.py ;;
          esac
      - name: Save the publish log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Log published Instagram posts" && git push)
